<StackLayout class="Page">
  <did-toolbar title="POSTiT!"></did-toolbar>
  <GridLayout columns="*" rows="*,auto">
    <ScrollView [scrollBarIndicatorVisible]="false">
      <StackLayout>
        <ng-container *ngIf="!postits.length">
          <GridLayout class="not-find" col="0" row="0" columns="*,auto,*" rows="*,auto,auto,*">
            <Label row="1" col="1" text="Nenhuma Categoria." class="no_content_label"></Label>
            <Label (tap)="navigateToRegisterCategory()" row="2" col="1" text="Clique aqui para criar uma." class="no_content_label_clique"></Label>
          </GridLayout>
        </ng-container>
        <ng-container *ngIf="postits.length">
          <WrapLayout col="0" row="0">
            <ng-container *ngFor="let postit of postits; let i = index; trackBy: postitTrackBy;">
              <Image src="~/assets/images/globe.png" [sharedTransitionTag]="'mundo-' + i" width="150" height="150" />
              <did-card
                [count]="postit.count"
                [name]="postit.name"
                (emitTap)="onClickItem(postit, 'mundo-' + i)"
              ></did-card>
            </ng-container>
          </WrapLayout>
        </ng-container>
      </StackLayout>
    </ScrollView>
  </GridLayout>
</StackLayout>
