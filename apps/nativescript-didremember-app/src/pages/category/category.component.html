<StackLayout class="Page">
  <did-toolbar [canBack]="true" title="POSTiT!"></did-toolbar>
  <GridLayout columns="*" rows="*">
    <StackLayout class="content">
      <StackLayout class="header">
        <ng-container [formGroup]="categoryForm">
          <GridLayout columns="auto" rows="auto, auto">
            <did-input-text col="0" row="0" [dirty]="fc.name.dirty" [errors]="fc.name.errors" controlName="name" label="Categoria" hint="Escreva o nome da categoria"></did-input-text>
            <FlexboxLayout col="0" row="1">
              <did-button *ngIf="selectPostit?.id != null" class="cancel" (emitTap)="cancel()" text="Cancelar"></did-button>
              <did-button *ngIf="selectPostit?.id" (emitTap)="submit()" text="Editar"></did-button>
              <did-button *ngIf="!selectPostit?.id" (emitTap)="submit()" text="Adicionar"></did-button>
            </FlexboxLayout>
          </GridLayout>
        </ng-container>
      </StackLayout>
      <StackLayout class="categories">
        <Label class="title" text="Lista de Categorias"></Label>
        <ScrollView [scrollBarIndicatorVisible]="false">
          <StackLayout>
            <ng-container *ngIf="postits.length else notFind">
              <ng-container *ngFor="let postit of postits">
                <did-list-item (delete)="deleteItem($event)" (select)="selectItem($event)" [selected]="selectPostit" [item]="postit"></did-list-item>
              </ng-container>
            </ng-container>
          </StackLayout>
        </ScrollView>
      </StackLayout>
    </StackLayout>
  </GridLayout>
</StackLayout>

<ng-template #notFind>
  <GridLayout class="not-find" columns="*, auto, *" rows="*,auto,auto,*" style="padding-top: 16; height: 100%;">
    <Label class="no_content_label" row="1" col="1" text="Nenhuma Categoria."></Label>
  </GridLayout>
</ng-template>
